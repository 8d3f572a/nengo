[package]
name = "nengo"
version = "0.2.0-rc.1"
edition = "2024"
description = "Japanese wareki (和暦) date string parser"
license = "Apache-2.0"
authors = ["chomod"]
repository = "https://github.com/8d3f572a/nengo"
readme = "README.md"
keywords = ["wareki", "japanese", "date", "calendar", "nengo"]
categories = ["date-and-time"]

[dependencies]
chrono = { version = "0.4", optional = true }
once_cell = "1"
regex = "1"

[features]
default = ["chrono"]
chrono = ["dep:chrono"]
